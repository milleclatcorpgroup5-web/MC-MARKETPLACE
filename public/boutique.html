<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>M.C — Boutik vandè</title>
<meta name="description" content="Dekouvri boutik ak vandè lokal sou M.C Marketplace Ayiti."><style>
:root{--n:#141414;--b:#000;--o:#E8B84B;--g:#2E9E5B;--c:#F7F3EC;--w:#fff;--t:#1A2733;--m:#6B7785;--l:#E4DFD3}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--c);color:var(--t)}a{text-decoration:none;color:inherit}header{background:#000;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}.logo{color:var(--o);font-weight:800}.logo span{color:#fff}.back{font-size:13px;color:#ccc}main{max-width:1000px;margin:auto;padding:22px 20px 60px}.shop{background:#fff;border:1px solid var(--l);border-radius:13px;padding:23px;margin-bottom:20px;display:flex;gap:18px;align-items:center}.avatar{width:70px;height:70px;border-radius:50%;background:#EDE6D8;display:grid;place-items:center;font-size:28px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.shop h1{font-size:24px}.muted{font-size:13px;color:var(--m)}.badge{display:inline-flex;background:#E7F6ED;color:#237443;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800}.trust{color:#8B6A18;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--l);border-radius:10px;overflow:hidden}.photo{height:160px;background:#EDE6D8;display:grid;place-items:center;color:var(--m)}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:12px}.price{font-size:17px;font-weight:800;margin-top:5px}.btn{display:block;margin-top:9px;background:var(--n);color:#fff;text-align:center;padding:8px;border-radius:7px;font-size:12px;font-weight:800}.empty{padding:40px;text-align:center;color:var(--m)}@media(max-width:600px){.shop{align-items:flex-start}.shop h1{font-size:20px}}
</style><script src="mc-notifications-v3.3.js"></script>
</head><body><header><a class="logo" href="index.html">M.C <span>Marketplace</span></a><a class="back" href="index.html">← Retounen</a></header><main id="main"><div class="empty">Chajman boutik...</div></main><script type="module">
const firebaseConfig={apiKey:"AIzaSyB_1RmQ3t-8Zzpg-mirSCv59KrioDsmjT8",authDomain:"mc-marketplaceht.firebaseapp.com",projectId:"mc-marketplaceht",storageBucket:"mc-marketplaceht.firebasestorage.app",messagingSenderId:"788708293876",appId:"1:788708293876:web:09922c1e17ed6f51a2b2a1"};const {initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");const {getFirestore,doc,getDoc,collection,getDocs,query,where}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");const app=initializeApp(firebaseConfig),db=getFirestore(app),id=new URLSearchParams(location.search).get('id');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!id)return fail();try{const s=await getDoc(doc(db,'vendeurs_public',id));if(!s.exists())return fail();const v={id:s.id,...s.data()},productsMap=new Map();const queries=[query(collection(db,'produits'),where('vendeurId','==',id)),query(collection(db,'produits'),where('vendeurUid','==',id))];for(const q of queries){const ps=await getDocs(q);ps.forEach(d=>productsMap.set(d.id,{id:d.id,...d.data()}));}const products=[...productsMap.values()];document.getElementById('main').innerHTML=`<section class="shop"><div class="avatar">${v.logoUrl?`<img src="${v.logoUrl}" alt="">`:'🏪'}</div><div><h1>${esc(v.nom||'Boutik lokal')} ${v.verifie===true?'<span class="badge">✓ Verifye</span>':''}</h1><div class="muted">📍 ${esc(v.ville||'Ayiti')} · 🛒 ${Number(v.ventesTotal||0).toLocaleString('fr-FR')} vant ${v.trustScore?`· 🛡 Trust Score <span class="trust">${v.trustScore}/100</span>`:''}</div><p class="muted" style="margin-top:8px">${esc(v.description||'Vandè patnè M.C Marketplace.')}</p></div></section><div style="display:flex;justify-content:space-between;align-items:end;margin:0 0 14px"><div><h2>Pwodwi boutik la</h2><div class="muted">${products.length} pwodwi</div></div></div><div class="grid" id="products"></div>`;const box=document.getElementById('products');if(!products.length){box.innerHTML='<div class="empty">Boutik sa a poko gen pwodwi.</div>';return}box.innerHTML=products.map(p=>`<article class="card"><div class="photo">${p.imageUrl?`<img src="${p.imageUrl}" alt="">`:'Foto'}</div><div class="body"><strong>${esc(p.nom)}</strong><div class="price">${Number(p.prix||0).toLocaleString('fr-FR')} G</div><a class="btn" href="produit.html?id=${p.id}">Wè pwodwi a</a></div></article>`).join('')}catch(e){fail()}}
function fail(){document.getElementById('main').innerHTML='<div class="empty">Boutik pa jwenn.</div>'}load();
</script><script type="module" src="mc-analytics.js"></script>
<script src="mc-seo.js"></script>
</body></html>
